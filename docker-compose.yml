version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: picloud-portal-backend
    restart: unless-stopped
    ports:
      - "5005:5005"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/cloudflared:/etc/cloudflared:ro
      - /home/pavankumarpotta/.cloudflared:/home/pavankumarpotta/.cloudflared:rw
      - /sys:/sys:ro
    environment:
      - EXEC_MODE=local
      - PORT=5005
      - PG_CONTAINER=picloud-db
      - PG_USER=picloud
      - PG_DB=picloud

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: picloud-portal-frontend
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - BACKEND_URL=http://backend:5005
      - NODE_ENV=production
    depends_on:
      - backend
